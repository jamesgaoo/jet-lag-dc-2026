<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jet Lag DC 2026 — Zone Detector</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <h1>Jet Lag <span>DC 2026</span></h1>

    <button id="locate-btn">Locate Me</button>

    <div id="status-section">
      <div class="label">Status</div>
      <div id="geo-status">Waiting for location&hellip;</div>
    </div>

    <div id="coords-section">
      <div class="label">Coordinates</div>
      <div id="coords">&mdash;</div>
    </div>

    <div id="zone-section">
      <div class="label">Current Zone</div>
      <div id="zone-name">—</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@7/turf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
